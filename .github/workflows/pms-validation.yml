name: PMS validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/auth-legal-help-onboarding-search, feat/pms-auth-tour-themes-responsive, feat/platform-subscriptions-unit-pricing]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type-check, build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pms-web/pms-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pms-web/pms-web/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint

  backend:
    name: Laravel tests and changed PHP syntax
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: property-management-system
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check all backend PHP syntax
        run: find app database/migrations tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test 1 - fresh MySQL migrations
        run: php artisan migrate:fresh --force
      - name: Test 2 - database relationship integrity
        run: php artisan test tests/Feature/DatabaseRelationshipIntegrityTest.php
      - name: Test 3 - tenant and lease lifecycle
        run: php artisan test tests/Feature/PropertyTenantWorkflowTest.php
      - name: Test 4 - rent/payment and reconciliation integrations
        run: php artisan test tests/Feature/RentLedgerIntegrityTest.php tests/Feature/DarajaC2bRoutingSafetyTest.php tests/Unit/PaymentDestinationDarajaConfigurationTest.php
      - name: Test 5 - team and organization access
        run: php artisan test tests/Feature/TeamManagementTest.php tests/Feature/OrganizationOwnershipTest.php
      - name: Full Laravel regression suite
        run: php artisan test --exclude-group=parallel-mpesa
      - name: Concurrent duplicate M-PESA callback regression (isolated MySQL run)
        run: php artisan test --group=parallel-mpesa
