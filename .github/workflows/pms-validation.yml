name: PMS validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/auth-legal-help-onboarding-search, feat/pms-auth-tour-themes-responsive, feat/platform-subscriptions-unit-pricing]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type-check, build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pms-web/pms-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pms-web/pms-web/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint

  backend:
    name: Laravel tests and changed PHP syntax
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: property-management-system
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pms_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check changed PHP files
        run: |
          php -l app/Http/Controllers/AuthController.php
          php -l app/Http/Controllers/PlatformSubscriptionController.php
          php -l app/Http/Controllers/GuestTenantPaymentLinkController.php
          php -l app/Http/Controllers/PropertyController.php
          php -l app/Http/Controllers/UnitController.php
          php -l app/Http/Middleware/EnsureActivePlatformSubscription.php
          php -l app/Http/Middleware/EnsureSubscriptionFeature.php
          php -l app/Models/PlatformSubscription.php
          php -l app/Models/PlatformSubscriptionPayment.php
          php -l database/migrations/2026_10_10_000001_create_platform_subscriptions_table.php
          php -l database/migrations/2026_10_11_000001_add_portfolio_estimates_to_platform_subscriptions.php
          php -l config/services.php
      - run: php artisan test
